version: '3.8'

services:
  # Base de Dados de Documentos
  mongodb:
    image: mongo:6.0
    container_name: tp_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db

  # Base de Dados de Grafos
  neo4j:
    image: neo4j:5.12
    container_name: tp_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Interface Web (Browser)
      - "7687:7687" # Ligação Bolt (para o script Python)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASS}
    volumes:
      - neo4j_data:/data

  # Base de Dados Vetorial (Embeddings)
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: tp_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # API REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Cache e Rankings em Memória
  redis:
    image: redis:7.2
    container_name: tp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  neo4j_data:
  qdrant_data:
  redis_data:
